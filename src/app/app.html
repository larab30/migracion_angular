<div class="app-viewport">
  <!-- Barra de navegacion del equipo para seleccionar presentacion -->
  <header class="team-nav-bar">
    <div class="team-badge">
      <span class="team-dot"></span>
      <span class="team-title">Equipo Angular</span>
    </div>

    <nav class="nav-pills" aria-label="Seleccionar tarjeta">
      <button 
        type="button" 
        class="nav-pill" 
        [class.active]="perfilActivo() === 'dante'"
        (click)="seleccionarPerfil('dante')">
        🎸 Dante
      </button>

      <button 
        type="button" 
        class="nav-pill" 
        [class.active]="perfilActivo() === 'bera'"
        (click)="seleccionarPerfil('bera')">
        🌸 Bera
      </button>

      <button 
        type="button" 
        class="nav-pill" 
        [class.active]="perfilActivo() === 'joseph'"
        (click)="seleccionarPerfil('joseph')">
        💼 Joseph
      </button>
    </nav>
  </header>

  <!-- Contenedor dinamico de tarjetas -->
  <main class="card-display-area">
    @switch (perfilActivo()) {
      @case ('dante') {
        <app-carta-dante />
      }
      @case ('bera') {
        <app-carta-bera />
      }
      @case ('joseph') {
        <app-carta-presentacion />
      }
    }
  </main>
</div>
